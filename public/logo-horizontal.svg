<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipboard -->
  <rect x="40" y="60" width="120" height="140" fill="none" stroke="#1B5E3F" stroke-width="8" rx="8"/>
  <rect x="65" y="40" width="70" height="25" fill="#C9A961" rx="4"/>
  <circle cx="100" cy="52" r="6" fill="#E8D5B7"/>

  <!-- Checkmarks -->
  <g stroke="#1B5E3F" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="60,90 75,105 95,85"/>
    <polyline points="60,120 75,135 95,115"/>
    <polyline points="60,150 75,165 95,145"/>
  </g>

  <!-- Ring -->
  <circle cx="170" cy="150" r="45" fill="none" stroke="#C9A961" stroke-width="12"/>
  <circle cx="185" cy="130" r="22" fill="none" stroke="#C9A961" stroke-width="10"/>
  <polygon points="185,110 195,115 190,100" fill="#C9A961"/>

  <!-- Leaf accent -->
  <path d="M 50 200 Q 45 220 55 240 Q 60 220 50 200" fill="#6BA584"/>

  <!-- Text -->
  <text x="260" y="130" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#1B5E3F">Wedding Planning</text>
  <text x="260" y="190" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#1B5E3F">
    <tspan fill="#1B5E3F">Checklists</tspan>
  </text>

  <!-- Tagline -->
  <text x="260" y="220" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#6BA584">Plan beautifully. Celebrate fully.</text>
</svg>