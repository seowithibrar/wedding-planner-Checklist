<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title id="title">Wedding budget priorities for a 90-day plan</title>
  <rect width="1200" height="675" rx="32" fill="#fffaf8"/>
  <text x="600" y="78" text-anchor="middle" fill="#263238" font-family="Arial,sans-serif" font-size="32" font-weight="700">SET YOUR PRIORITIES BEFORE YOU PAY A DEPOSIT</text>
  <circle cx="340" cy="365" r="190" fill="#e7f0e8"/>
  <path d="M340 365V175a190 190 0 0 1 180 130z" fill="#b76e79"/>
  <path d="M340 365 520 305a190 190 0 0 1-93 226z" fill="#d4af7e"/>
  <path d="M340 365 427 531a190 190 0 0 1-202-6z" fill="#8cae98"/>
  <path d="M340 365 225 525a190 190 0 0 1-65-218z" fill="#8194a0"/>
  <path d="M340 365 160 307a190 190 0 0 1 180-132z" fill="#e7c5ca"/>
  <circle cx="340" cy="365" r="80" fill="#fffaf8"/>
  <text x="340" y="357" text-anchor="middle" fill="#263238" font-family="Arial,sans-serif" font-size="19" font-weight="700">WEDDING</text>
  <text x="340" y="383" text-anchor="middle" fill="#263238" font-family="Arial,sans-serif" font-size="19" font-weight="700">BUDGET</text>
  <g font-family="Arial,sans-serif" font-size="27" fill="#263238">
    <circle cx="700" cy="235" r="16" fill="#b76e79"/><text x="737" y="244">Venue</text>
    <circle cx="700" cy="315" r="16" fill="#d4af7e"/><text x="737" y="324">Food</text>
    <circle cx="700" cy="395" r="16" fill="#8cae98"/><text x="737" y="404">Photography</text>
    <circle cx="700" cy="475" r="16" fill="#8194a0"/><text x="737" y="484">Other priorities</text>
  </g>
  <rect x="925" y="202" width="170" height="190" rx="20" fill="#f7efdf" stroke="#d8c69c" stroke-width="4"/>
  <rect x="949" y="224" width="122" height="48" rx="8" fill="#fff" stroke="#d8c69c" stroke-width="3"/>
  <path d="M967 295h86M967 324h86M967 353h86" stroke="#bd9560" stroke-width="9" stroke-linecap="round"/>
  <text x="1010" y="437" text-anchor="middle" fill="#8d6c40" font-family="Arial,sans-serif" font-size="20" font-weight="700">PLAN YOUR SPEND</text>
  <text x="600" y="592" text-anchor="middle" fill="#596366" font-family="Arial,sans-serif" font-size="22">Choose two or three priorities and keep the rest simple</text>
</svg>
