<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="15" y="15" width="270" height="270" fill="none" stroke="#1B5E3F" stroke-width="12" rx="30"/>

  <!-- Clipboard -->
  <g>
    <rect x="50" y="60" width="80" height="100" fill="none" stroke="#1B5E3F" stroke-width="6" rx="5"/>
    <rect x="65" y="45" width="50" height="18" fill="#C9A961" rx="3"/>
    <circle cx="90" cy="54" r="4" fill="#E8D5B7"/>

    <!-- Checkmarks -->
    <g stroke="#1B5E3F" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="65,75 75,85 90,70"/>
      <polyline points="65,100 75,110 90,95"/>
      <polyline points="65,125 75,135 90,120"/>
    </g>
  </g>

  <!-- Ring -->
  <g>
    <circle cx="170" cy="130" r="50" fill="none" stroke="#C9A961" stroke-width="14"/>
    <circle cx="190" cy="105" r="26" fill="none" stroke="#C9A961" stroke-width="12"/>
    <polygon points="190,75 205,82 200,62" fill="#C9A961"/>
  </g>

  <!-- Leaf accent -->
  <path d="M 45 210 Q 35 235 50 260 Q 60 230 45 210" fill="#6BA584" opacity="0.7"/>
  <path d="M 255 80 Q 270 60 275 90 Q 260 100 255 80" fill="#C9A961" opacity="0.5"/>
</svg>