<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Wedding nail timeline</title>
  <desc id="desc">A six-step plan schedules nail inspiration, a trial, care, final manicure and a wedding-day repair kit.</desc>
  <rect width="1200" height="1500" rx="42" fill="#fbf7f4"/>
  <path d="M235 180v1090" stroke="#d6a2a0" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <g fill="#fff" stroke="#d6a2a0" stroke-width="8">
      <circle cx="235" cy="220" r="46"/><circle cx="235" cy="425" r="46"/><circle cx="235" cy="630" r="46"/>
      <circle cx="235" cy="835" r="46"/><circle cx="235" cy="1040" r="46"/><circle cx="235" cy="1245" r="46"/>
    </g>
    <g fill="#a85f6b" font-size="34" font-weight="700" text-anchor="middle">
      <text x="235" y="232">1</text><text x="235" y="437">2</text><text x="235" y="642">3</text>
      <text x="235" y="847">4</text><text x="235" y="1052">5</text><text x="235" y="1257">6</text>
    </g>
    <g fill="#fff" stroke="#eadbd5" stroke-width="4">
      <rect x="340" y="150" width="730" height="140" rx="28"/><rect x="340" y="355" width="730" height="140" rx="28"/>
      <rect x="340" y="560" width="730" height="140" rx="28"/><rect x="340" y="765" width="730" height="140" rx="28"/>
      <rect x="340" y="970" width="730" height="140" rx="28"/><rect x="340" y="1175" width="730" height="140" rx="28"/>
    </g>
    <g fill="#493c39">
      <text x="390" y="210" font-size="30" font-weight="700">About six months out</text><text x="390" y="253" font-size="22">Save ideas and choose a nail technician.</text>
      <text x="390" y="415" font-size="30" font-weight="700">Three to four months out</text><text x="390" y="458" font-size="22">Trial the shape, length, colour and finish.</text>
      <text x="390" y="620" font-size="30" font-weight="700">About six weeks out</text><text x="390" y="663" font-size="22">Lock the design and care for your hands.</text>
      <text x="390" y="825" font-size="30" font-weight="700">One week out</text><text x="390" y="868" font-size="22">Avoid new products or home experiments.</text>
      <text x="390" y="1030" font-size="30" font-weight="700">One to three days before</text><text x="390" y="1073" font-size="22">Book the final manicure.</text>
      <text x="390" y="1235" font-size="30" font-weight="700">Wedding day</text><text x="390" y="1278" font-size="22">Pack your mini repair kit.</text>
    </g>
  </g>
</svg>
